name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 需要写权限：用于把 APK 发布到 Release
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 关键：复用同一份调试证书，让签名 SHA1 保持稳定。
      # 百度地图 AK 需要绑定「包名 + SHA1」，SHA1 每次都变会导致 AK 失效。
      - name: Restore signing keystore cache
        uses: actions/cache@v4
        with:
          path: .ci-signing
          key: ci-signing-keystore-v1

      - name: Prepare signing keystore
        id: keystore
        run: |
          set -e
          KS_DIR="$GITHUB_WORKSPACE/.ci-signing"
          KS="$KS_DIR/debug.keystore"
          mkdir -p "$KS_DIR"

          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            printf '%s' "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$KS"
            echo "使用仓库 Secret 提供的签名证书"
          elif [ -f "$KS" ]; then
            echo "复用缓存中的调试签名证书"
          else
            keytool -genkeypair -v \
              -keystore "$KS" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
            echo "已生成新的调试签名证书"
          fi

          echo "DEBUG_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

          SHA1=$(keytool -list -v -keystore "$KS" -alias androiddebugkey \
                   -storepass android -keypass android 2>/dev/null \
                 | awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d '[:space:]')
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"

          {
            echo "### 签名证书 SHA1（申请百度 AK 时填写）"
            echo '```'
            echo "$SHA1"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        id: build
        continue-on-error: true
        env:
          # 可选：配置后 AK 会被编译进 APK；不配置也能用（App 内可运行时填写）
          BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      - name: Rename APK
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             dist/baidu-map-radius-selector-debug.apk
          ls -lh dist

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: baidu-map-radius-selector-debug
          path: dist/*.apk
          retention-days: 30

      # 发布到 Release：无需登录即可直接下载（Actions artifact 需要登录）
      - name: Publish APK to release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: 'CI 最新构建（debug）'
          body: |
            由 GitHub Actions 自动构建的调试版 APK。

            - 提交：`${{ github.sha }}`
            - 触发：`${{ github.event_name }}`

            ### 签名证书 SHA1（申请百度 AK 时填写）

            ```
            ${{ steps.keystore.outputs.sha1 }}
            ```

            安装与 AK 配置请阅读仓库 README。
          files: dist/*.apk
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
